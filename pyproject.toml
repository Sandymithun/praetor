[project]
name = "praetor"
version = "0.1.0"
description = "Alert triage and response automation for security operations"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["praetor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
